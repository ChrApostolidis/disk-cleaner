<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t"><title id="t">Ballast</title><!-- Ballast symbol, master. A porthole (ring r112/r96) with water held low (segment of r88 below y=144)
