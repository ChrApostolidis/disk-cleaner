<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 13px/1.3 "Segoe UI", system-ui, sans-serif; background: #e9e9e9; color: #111; padding: 20px; }
  h1 { font-size: 16px; margin-bottom: 12px; }
  .row { display: grid; grid-template-columns: 110px 190px 190px 130px 130px 110px 110px 110px 110px 110px; gap: 10px;
         align-items: center; background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 14px; height: 246px; }
  .cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 100%;
          border-radius: 8px; padding: 8px; overflow: hidden; }
  /* Every mark is scaled to fit its box, so wide lockups shrink instead of overflowing. */
  .cell small { color: #888; font-size: 11px; }
  .light { background: #ffffff; color: #1c2027; --accent: #2563eb; border: 1px solid #eee; }
  .dark { background: #15171c; color: #e8eaee; --accent: #5b8def; }
  .dark small { color: #999; }
  .mono { background: #fff; color: #111; --accent: #111; border: 1px solid #eee; }
  .big svg { width: 170px; height: 150px; }
  .sizes { display: flex; align-items: flex-end; gap: 10px; }
  .s64 svg { width: 64px; height: 64px; } .s32 svg { width: 32px; height: 32px; } .s16 svg { width: 16px; height: 16px; }
  .circle { width: 90px; height: 90px; border-radius: 50%; overflow: hidden; background: #15171c; color: #e8eaee;
            --accent: #5b8def; display: flex; align-items: center; justify-content: center; }
  .circle svg { width: 72px; height: 72px; }
  .mid svg { width: 90px; height: 80px; }
  .blur svg { filter: blur(3px); }
  .mirror svg { transform: scaleX(-1); }
  .rot svg { transform: rotate(180deg); }
  .name { font-weight: 600; word-break: break-all; }
</style></head><body>
