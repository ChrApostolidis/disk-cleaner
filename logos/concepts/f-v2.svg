<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><!--
  Ballast, concept F v2: porthole, low water, two bubbles rising off-centre.
  Grid unit 16 on a 256 canvas, centre (128,128).
  Ring: filled annulus, outer r112 (edges 16/240), inner r96 (edges 32/224), 16 thick.
