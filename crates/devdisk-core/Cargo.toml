[package]
name = "devdisk-core"
version = "0.1.0"
edition = "2024"
description = "Scanning, project detection and cleanup logic for DevDisk"

[dependencies]
blake3 = "1.8.7"
jwalk = "0.9.0"
rayon = "1.12.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
trash = "5.3.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }

[target."cfg(windows)".dev-dependencies]
junction = "2.1.0"

[dev-dependencies]
tempfile = "3.27.0"
