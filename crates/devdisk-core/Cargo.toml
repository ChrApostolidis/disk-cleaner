[package]
name = "devdisk-core"
version = "0.1.0"
edition = "2024"
description = "Scanning, project detection and cleanup logic for DevDisk"

[dependencies]
jwalk = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[target."cfg(windows)".dev-dependencies]
junction = "2.1.0"

[dev-dependencies]
tempfile = "3.27.0"
